<!DOCTYPE html>
<html>
<body>

<h3>LIFF SYSTEM</h3>
<div id="log">START</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

const LIFF_ID = "2010580391-Mhg030Xz";
const API_URL = "https://script.google.com/macros/s/AKfycbzSX5CoM6tZmt2dMvMExyOxHniQdYLAZo6TfiTIWzatk3lycrTOCjz4RbULnLV-xEhz-g/exec";

function log(msg){
  document.getElementById("log").innerText = msg;
  console.log(msg);
}

window.onload = async function () {

  try {

    log("INIT START");

    await liff.init({ liffId: LIFF_ID });

    log("LIFF READY");

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    log("USER OK");

    log("BEFORE FETCH");

    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        action: "GET_PROFILE",
        userId: profile.userId,
        name: profile.displayName
      })
    });

    log("STATUS: " + res.status);

    const data = await res.json();

    log("DONE: " + JSON.stringify(data));

  } catch (err) {
    log("ERROR: " + err.toString());
  }
};

</script>

</body>
</html>
